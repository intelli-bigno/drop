name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Desktop (Electron) 테스트
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: TypeCheck Desktop
        run: pnpm --filter @drop/desktop typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:run

      - name: Build Desktop
        run: pnpm --filter @drop/desktop build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test_key

  # Mobile (Flutter) 테스트
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Clean and install dependencies
        working-directory: apps/mobile
        run: |
          flutter clean
          flutter pub get

      - name: Setup secrets
        working-directory: apps/mobile
        run: cp lib/core/config/secrets.dart.example lib/core/config/secrets.dart

      - name: Generate code
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Disable custom_lint for CI
        working-directory: apps/mobile
        run: |
          # Remove custom_lint plugin from analysis_options.yaml for CI
          # (custom_lint has cache issues in CI environment)
          sed -i '/plugins:/d; /- custom_lint/d' analysis_options.yaml

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

  # iOS 네이티브 (apps/ios) — Flutter를 대체하는 트랙
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.app

      # 도메인 로직 테스트. 시뮬레이터가 필요 없어 가장 빠른 신호다.
      - name: DropCore tests
        working-directory: apps/ios/Packages/DropCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      # 실제 값은 필요 없다 — 빌드가 통과하는지만 본다.
      # 컴파일 시점에 들어가는 값이라 자리표시자로 충분하다.
      - name: Prepare build configuration
        working-directory: apps/ios
        run: |
          cp Config/Config-localdev.xcconfig.example Config/Config-localdev.xcconfig
          cp Config/Config-remote.xcconfig.example Config/Config-remote.xcconfig

      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build (simulator)
        working-directory: apps/ios
        run: |
          xcodebuild -project Drop.xcodeproj \
            -scheme Drop-localdev \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
