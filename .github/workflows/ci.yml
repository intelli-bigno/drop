name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Desktop (Electron) 테스트
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: TypeCheck Desktop
        run: pnpm --filter @drop/desktop typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:run

      - name: Build Desktop
        run: pnpm --filter @drop/desktop build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test_key

  # Android 네이티브 (apps/android) — Jetpack Compose 트랙, BRU-36 (하위 BRU-38~42)
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 도메인 로직 테스트. Android SDK도 에뮬레이터도 필요 없어 가장 빠른 신호다.
      - name: core tests
        working-directory: apps/android
        run: ./gradlew :core:test

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 실제 값은 필요 없다 — 빌드가 통과하는지만 본다.
      # 컴파일 시점에 BuildConfig로 굽는 값이라 자리표시자로 충분하다.
      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test_key

  # iOS 네이티브 (apps/ios)
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 러너에 깔린 Xcode 버전은 이미지 업데이트마다 바뀐다.
      # 특정 경로를 박아 두면 그때마다 CI가 깨지므로 가장 최신 것을 고른다.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version
          swift --version

      # 도메인 로직 테스트. 시뮬레이터가 필요 없어 가장 빠른 신호다.
      - name: DropCore tests
        working-directory: apps/ios/Packages/DropCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      # 실제 값은 필요 없다 — 빌드가 통과하는지만 본다.
      # 컴파일 시점에 들어가는 값이라 자리표시자로 충분하다.
      - name: Prepare build configuration
        working-directory: apps/ios
        run: |
          cp Config/Config-localdev.xcconfig.example Config/Config-localdev.xcconfig
          cp Config/Config-remote.xcconfig.example Config/Config-remote.xcconfig

      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build (simulator)
        working-directory: apps/ios
        run: |
          SIM_ID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for r in d.values() for x in r if 'iPhone' in x['name']][0])")
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcodebuild -project Drop.xcodeproj \
            -scheme Drop-localdev \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # 빌드만으로는 번들 구성 오류가 드러나지 않는다.
      # DropShare에 CFBundleExecutable이 빠졌을 때 빌드는 통과하고
      # 설치에서만 거부됐다 — 그래서 설치까지 해 본다.
      - name: Install on simulator
        working-directory: apps/ios
        run: |
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl install "$SIM_ID" \
            build/Build/Products/Debug-localdev-iphonesimulator/Drop.app
