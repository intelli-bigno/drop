name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Desktop (Electron) 테스트
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # 토큰 생성물(CSS·Swift·Kotlin)은 커밋된다 — iOS·Android 빌드가 Node에
      # 의존하지 않게 하려는 것이다. 정본(tokens.json)만 고치고 생성물을 빠뜨리면
      # 세 앱의 색이 조용히 어긋나므로 여기서 끊는다.
      - name: Check design tokens are generated
        run: make tokens-check

      - name: TypeCheck Desktop
        run: pnpm --filter @drop/desktop typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:run

      - name: Build Desktop
        run: pnpm --filter @drop/desktop build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test_key

  # Android 네이티브 (apps/android) — Jetpack Compose 트랙, BRU-36 (하위 BRU-38~42)
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 도메인 로직 테스트. Android SDK도 에뮬레이터도 필요 없어 가장 빠른 신호다.
      - name: core tests
        working-directory: apps/android
        run: ./gradlew :core:test

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 실제 값은 필요 없다 — 빌드가 통과하는지만 본다.
      # 컴파일 시점에 BuildConfig로 굽는 값이라 자리표시자로 충분하다.
      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test_key

  # iOS 네이티브 (apps/ios)
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 러너에 깔린 Xcode 버전은 이미지 업데이트마다 바뀐다.
      # 특정 경로를 박아 두면 그때마다 CI가 깨지므로 가장 최신 것을 고른다.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version
          swift --version

      # 도메인 로직 테스트. 시뮬레이터가 필요 없어 가장 빠른 신호다.
      - name: DropCore tests
        working-directory: apps/ios/Packages/DropCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      # 실제 값은 필요 없다 — 빌드가 통과하는지만 본다.
      # 컴파일 시점에 들어가는 값이라 자리표시자로 충분하다.
      - name: Prepare build configuration
        working-directory: apps/ios
        run: |
          cp Config/Config-localdev.xcconfig.example Config/Config-localdev.xcconfig
          cp Config/Config-remote.xcconfig.example Config/Config-remote.xcconfig

      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build (simulator)
        working-directory: apps/ios
        run: |
          # 배포 타깃(iOS 26)보다 낮은 런타임의 시뮬레이터는 이 스킴의
          # destination이 되지 못한다. 아무 iPhone이나 집으면 구 런타임이
          # 걸려 "Unable to find a destination"으로 죽는다 — 런타임 버전을
          # 내림차순으로 정렬해 가장 높은 iOS에서 고른다.
          SIM_ID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,re,sys; d=json.load(sys.stdin)['devices']; ks=sorted([k for k in d if 'iOS' in k], key=lambda k: [int(n) for n in re.findall(r'\d+', k)], reverse=True); print(next(x['udid'] for k in ks for x in d[k] if 'iPhone' in x['name']))")
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcodebuild -project Drop.xcodeproj \
            -scheme Drop-localdev \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # 빌드만으로는 번들 구성 오류가 드러나지 않는다.
      # DropShare에 CFBundleExecutable이 빠졌을 때 빌드는 통과하고
      # 설치에서만 거부됐다 — 그래서 설치까지 해 본다.
      - name: Install on simulator
        working-directory: apps/ios
        run: |
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl install "$SIM_ID" \
            build/Build/Products/Debug-localdev-iphonesimulator/Drop.app

  # Mobile — Flutter (apps/mobile, BRU-152 재구축 트랙)
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 로컬(Mac Studio)과 같은 버전으로 핀 — 자동 업그레이드로 CI가 흔들리지 않게.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # 도메인 로직 테스트. 에뮬레이터가 필요 없어 가장 빠른 신호다 (DropCore와 같은 규율).
      - name: drop_core tests
        working-directory: apps/mobile/packages/drop_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: App tests
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
