name: Release

on:
  push:
    tags:
      - 'v*'
  # 태그 없이 iOS만 테스터에게 보낼 때 쓴다 (데스크톱 릴리스는 나가지 않는다)
  workflow_dispatch:
    inputs:
      target:
        description: '빌드·배포 대상'
        type: choice
        options:
          - ios
        default: ios

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  # Mac (Electron) 빌드 및 Notarization
  release-mac:
    # 데스크톱은 태그 릴리스에서만 나간다 — 수동 실행은 iOS 전용
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Update version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Updating version to $VERSION"
          cd apps/desktop
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Import Code Signing Certificate
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Import certificate from secrets
          echo -n "$CERTIFICATES_P12" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build and Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # 발행은 아래 "Upload to GitHub Release" 한 곳만 한다.
        # GH_TOKEN이 보이면 electron-builder가 스스로 draft 릴리스를 만들어 중복된다.
        run: pnpm --filter @drop/desktop dist:remote:ci

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DROP-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.yml

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # iOS(apps/ios) TestFlight 배포 — 유일한 모바일 배포 경로.
  # 태그를 밀면 데스크톱 DMG 공증까지 함께 나간다.
  # 검증 빌드만 보낼 때는 태그 없이:
  #   gh workflow run release.yml -f target=ios
  release-ios:
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || inputs.target == 'ios'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare build configuration
        working-directory: apps/ios
        env:
          SUPABASE_URL_REMOTE: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_REMOTE: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ios-config.sh
          # 로컬 구성은 필요 없지만 프로젝트 생성이 두 파일을 모두 요구한다
          cp apps/ios/Config/Config-remote.xcconfig apps/ios/Config/Config-localdev.xcconfig

      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Import signing assets
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IOS_NATIVE_PROVISIONING_PROFILE: ${{ secrets.IOS_NATIVE_PROVISIONING_PROFILE }}
          IOS_NATIVE_SHARE_PROVISIONING_PROFILE: ${{ secrets.IOS_NATIVE_SHARE_PROVISIONING_PROFILE }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$CERTIFICATES_P12" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 프로파일은 UUID 이름으로 두어야 xcodebuild가 찾는다
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          for pair in "app:$IOS_NATIVE_PROVISIONING_PROFILE" "share:$IOS_NATIVE_SHARE_PROVISIONING_PROFILE"; do
            NAME=${pair%%:*}; DATA=${pair#*:}
            [ -z "$DATA" ] && { echo "❌ $NAME 프로파일 시크릿이 비어 있습니다"; exit 1; }
            TMP=$RUNNER_TEMP/$NAME.mobileprovision
            echo -n "$DATA" | base64 --decode -o "$TMP"
            UUID=$(security cms -D -i "$TMP" | plutil -extract UUID raw -)
            cp "$TMP" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
            echo "$NAME → $UUID"
          done

      # 과거 Flutter 빌드와 같은 앱 레코드를 이어 쓰므로 빌드 번호가 기존 것보다 커야 한다.
      # (전환 시점 최신은 38이었다) 시간 기반이면 항상 증가하고 충돌하지 않는다.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(date -u +%y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: apps/ios
        run: |
          xcodebuild -project Drop.xcodeproj \
            -scheme Drop-remote \
            -configuration Release-remote \
            -archivePath $RUNNER_TEMP/Drop.xcarchive \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA
        working-directory: apps/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Drop.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app --type ios \
            -f $RUNNER_TEMP/ipa/*.ipa \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DROP-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
