name: Release

on:
  push:
    tags:
      - 'v*'
  # 태그 없이 모바일만 테스터에게 보낼 때 쓴다 (데스크톱 릴리스는 나가지 않는다)
  workflow_dispatch:
    inputs:
      target:
        description: '빌드·배포 대상'
        type: choice
        options:
          - ios
          - android
        default: ios

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  # Mac (Electron) 빌드 및 Notarization
  release-mac:
    # 데스크톱은 태그 릴리스에서만 나간다 — 수동 실행은 iOS 전용
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Update version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Updating version to $VERSION"
          cd apps/desktop
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Import Code Signing Certificate
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Import certificate from secrets
          echo -n "$CERTIFICATES_P12" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build and Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # 발행은 아래 "Upload to GitHub Release" 한 곳만 한다.
        # GH_TOKEN이 보이면 electron-builder가 스스로 draft 릴리스를 만들어 중복된다.
        run: pnpm --filter @drop/desktop dist:remote:ci

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DROP-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.yml

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # iOS(apps/ios) TestFlight 배포 — 유일한 모바일 배포 경로.
  # 태그를 밀면 데스크톱 DMG 공증까지 함께 나간다.
  # 검증 빌드만 보낼 때는 태그 없이:
  #   gh workflow run release.yml -f target=ios
  release-ios:
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || inputs.target == 'ios'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare build configuration
        working-directory: apps/ios
        env:
          SUPABASE_URL_REMOTE: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_REMOTE: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ios-config.sh
          # 로컬 구성은 필요 없지만 프로젝트 생성이 두 파일을 모두 요구한다
          cp apps/ios/Config/Config-remote.xcconfig apps/ios/Config/Config-localdev.xcconfig

      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Import signing assets
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IOS_NATIVE_PROVISIONING_PROFILE: ${{ secrets.IOS_NATIVE_PROVISIONING_PROFILE }}
          IOS_NATIVE_SHARE_PROVISIONING_PROFILE: ${{ secrets.IOS_NATIVE_SHARE_PROVISIONING_PROFILE }}
          IOS_WIDGET_PROVISIONING_PROFILE: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$CERTIFICATES_P12" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 프로파일은 UUID 이름으로 두어야 xcodebuild가 찾는다.
          # 위젯(BRU-35에서 추가된 타깃)까지 셋 다 넣어야 한다 — 하나라도 빠지면 그 확장이
          # entitlements 없이 서명되어 업로드가 App Store 검증에서 막힌다 (BRU-58).
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          : > "$RUNNER_TEMP/imported-profiles.txt"
          for pair in "app:$IOS_NATIVE_PROVISIONING_PROFILE" \
                      "share:$IOS_NATIVE_SHARE_PROVISIONING_PROFILE" \
                      "widget:$IOS_WIDGET_PROVISIONING_PROFILE"; do
            NAME=${pair%%:*}; DATA=${pair#*:}
            [ -z "$DATA" ] && { echo "❌ $NAME 프로파일 시크릿이 비어 있습니다"; exit 1; }
            TMP=$RUNNER_TEMP/$NAME.mobileprovision
            echo -n "$DATA" | base64 --decode -o "$TMP"
            PLIST=$(security cms -D -i "$TMP")
            UUID=$(echo "$PLIST" | plutil -extract UUID raw -)
            PROFILE_NAME=$(echo "$PLIST" | plutil -extract Name raw -)
            APP_ID=$(echo "$PLIST" | plutil -extract Entitlements.application-identifier raw -)
            cp "$TMP" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
            echo "$PROFILE_NAME" >> "$RUNNER_TEMP/imported-profiles.txt"
            echo "$NAME → $PROFILE_NAME ($APP_ID, $UUID)"
          done

      # ExportOptions가 이름으로 부르는 프로파일이 실제로 들어와 있는지 여기서 끊는다.
      # 어긋나면 export는 조용히 넘어가고 업로드 단계에서야 409로 막힌다 (BRU-58).
      - name: Verify provisioning profiles match ExportOptions
        working-directory: apps/ios
        run: |
          MISSING=0
          while read -r WANTED; do
            [ -z "$WANTED" ] && continue
            if grep -Fqx "$WANTED" "$RUNNER_TEMP/imported-profiles.txt"; then
              echo "✅ $WANTED"
            else
              echo "❌ ExportOptions가 요구하는 프로파일이 없습니다: $WANTED"
              MISSING=1
            fi
          done < <(plutil -extract provisioningProfiles json -o - ExportOptions.plist \
                   | python3 -c 'import json,sys; [print(v) for v in json.load(sys.stdin).values()]')
          echo "--- 임포트된 프로파일 ---"; cat "$RUNNER_TEMP/imported-profiles.txt"
          [ "$MISSING" -eq 0 ] || exit 1

      # 과거 Flutter 빌드와 같은 앱 레코드를 이어 쓰므로 빌드 번호가 기존 것보다 커야 한다.
      # (전환 시점 최신은 38이었다) 시간 기반이면 항상 증가하고 충돌하지 않는다.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(date -u +%y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: apps/ios
        run: |
          xcodebuild -project Drop.xcodeproj \
            -scheme Drop-remote \
            -configuration Release-remote \
            -archivePath $RUNNER_TEMP/Drop.xcarchive \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA
        working-directory: apps/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Drop.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist ExportOptions.plist

      # altool은 검증에 실패해도 종료코드 0을 낸다 — 그대로 두면 업로드가 막혀도
      # 잡이 초록으로 끝난다. v0.0.10·v1.0.29 두 릴리스가 그렇게 조용히 사라졌다 (BRU-58).
      # 출력에 ERROR가 있으면 여기서 잡을 실패시킨다.
      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          LOG=$RUNNER_TEMP/altool.log
          set +e
          xcrun altool --upload-app --type ios \
            -f $RUNNER_TEMP/ipa/*.ipa \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD" 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if grep -qE "ERROR: \[" "$LOG"; then
            echo "❌ TestFlight 업로드가 실패했습니다 (altool이 ERROR를 냈습니다)"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "❌ altool이 종료코드 $STATUS 로 끝났습니다"
            exit "$STATUS"
          fi
          # 성공했다면 altool은 업로드 완료 문구를 남긴다. 없으면 믿지 않는다.
          grep -qiE "No errors uploading|UPLOAD SUCCEEDED" "$LOG" || {
            echo "❌ 업로드 성공 문구를 찾지 못했습니다 — 성공으로 간주하지 않습니다"
            exit 1
          }
          echo "✅ TestFlight 업로드 성공"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DROP-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa

  # Android 네이티브(apps/android) 배포 — BRU-42.
  #
  # 두 경로로 나간다:
  #   1. Firebase App Distribution — 자격증명이 이미 있어 지금 동작한다 (Flutter 시절 경로)
  #   2. Play 내부 테스트 — PLAY_SERVICE_ACCOUNT_JSON 시크릿이 있을 때만. 없으면 큰 소리로 스킵
  #
  # 검증 빌드만 보낼 때는 태그 없이:
  #   gh workflow run release.yml -f target=android
  release-android:
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || inputs.target == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 서명 키. 네 값이 모두 있어야 릴리스 서명이 된다 — 하나라도 비면 빌드가
      # 디버그 키로 서명되고, 그러면 "로그인만 안 되는 빌드"가 테스터에게 나간다.
      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE ANDROID_KEY_ALIAS ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "❌ 시크릿 $name 이 비어 있습니다"; exit 1; }
          done
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/drop-release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/drop-release.keystore"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # versionCode는 단조 증가해야 하고 Play 상한(2,100,000,000)을 넘으면 안 된다.
      # iOS가 쓰는 yyMMddHHmm(2608…)은 상한을 넘는다 — 2025-01-01 이후 "분"으로 만든다.
      # Flutter 시절 값(run_number 기반, 수백)보다 훨씬 크므로 되돌아가지 않는다.
      - name: Compute version
        run: |
          echo "VERSION_CODE=$(( ( $(date -u +%s) - 1735689600 ) / 60 ))" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB
        working-directory: apps/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID; do
            [ -n "${!name}" ] || { echo "❌ 시크릿 $name 이 비어 있습니다"; exit 1; }
          done
          ./gradlew --no-daemon \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" \
            :app:assembleRelease :app:bundleRelease

      # 서명 지문을 대조한다. Google은 (패키지명, SHA-1)로 앱을 매칭하므로 지문이
      # 어긋난 빌드는 로그인만 실패하는 빌드가 된다 — 그 상태로 배포되면 안 된다.
      # (BRU-30에서 실기 검증에 쓴 것과 같은 확인)
      - name: Verify release signature
        working-directory: apps/android
        env:
          EXPECTED_SHA1: A8:D1:12:55:A3:31:4B:C8:A8:1D:59:13:D4:43:2A:4A:01:78:60:17
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
                   | grep -i "SHA-1 digest" | head -1 | awk '{print $NF}')
          WANT=$(echo "$EXPECTED_SHA1" | tr -d ':' | tr 'A-Z' 'a-z')
          echo "expected=$WANT"
          echo "actual  =$ACTUAL"
          [ "$ACTUAL" = "$WANT" ] || {
            echo "❌ 릴리스 서명 지문이 등록된 것과 다릅니다 — 이 빌드로는 Google 로그인이 안 됩니다"
            exit 1
          }
          echo "✅ 릴리스 키로 서명됨 (bruce-clawdbot에 등록된 지문)"

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          releaseNotes: "DROP Android 네이티브 (versionCode ${{ env.VERSION_CODE }})"
          file: apps/android/app/build/outputs/apk/release/app-release.apk

      # Play 내부 테스트. 시크릿이 없으면 멈추지는 않되, 무엇이 없어서 안 나갔는지
      # 로그에 남긴다 — 조용히 넘어가면 "배포됐다"고 착각하게 된다.
      - name: Check Play credentials
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON 시크릿이 없어 Play 내부 테스트 업로드를 건너뜁니다 (BRU-42)"
          fi

      - name: Upload to Play internal track
        if: steps.play.outputs.available == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.intellieffect.drop.mobile
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DROP-android
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
