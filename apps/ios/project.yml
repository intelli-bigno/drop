name: Drop
options:
  bundleIdPrefix: com.intellieffect.drop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# 접속 대상(localdev / remote)은 빌드 구성으로 가른다.
# 개발 중에도 리모트를 봐야 할 때가 있어 Debug를 둘로 나눴다.
configs:
  Debug-localdev: debug
  Debug-remote: debug
  Release-remote: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: J2Y925QHNV
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  DropCore:
    path: Packages/DropCore
  DropUI:
    path: Packages/DropUI
  # 로그인 창을 띄우는 SDK라 화면에 붙어 있다 — DropCore가 아니라 앱 타겟이 쓴다.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0

targets:
  Drop:
    type: application
    platform: iOS
    sources:
      - path: Drop
    configFiles:
      Debug-localdev: Config/Config-localdev.xcconfig
      Debug-remote: Config/Config-remote.xcconfig
      Release-remote: Config/Config-remote.xcconfig
    dependencies:
      - package: DropCore
        product: DropCore
      - package: DropUI
        product: DropUI
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: DropShare
        embed: true
    settings:
      base:
        # Flutter 앱과 같은 번들 ID를 쓴다. 이미 App Group과 App Store Connect
        # 레코드가 붙어 있어 별도 등록이 필요 없다 — App Group 연결은 공개 API로는
        # 불가능해서, 새 ID를 쓰면 포털 수작업이 반드시 끼어든다.
        # 대가: 한 기기에 Flutter 앱과 공존하지 못하고 서로를 덮어쓴다.
        PRODUCT_BUNDLE_IDENTIFIER: com.intellieffect.drop.mobile
        INFOPLIST_FILE: Drop/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Drop/Drop.entitlements

  DropShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DropShare
    configFiles:
      Debug-localdev: Config/Config-localdev.xcconfig
      Debug-remote: Config/Config-remote.xcconfig
      Release-remote: Config/Config-remote.xcconfig
    dependencies:
      - package: DropCore
        product: DropCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intellieffect.drop.mobile.share
        INFOPLIST_FILE: DropShare/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: DropShare/DropShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Drop-localdev:
    build:
      targets:
        Drop: all
    run:
      config: Debug-localdev
    test:
      config: Debug-localdev
    archive:
      config: Release-remote

  Drop-remote:
    build:
      targets:
        Drop: all
    run:
      config: Debug-remote
    test:
      config: Debug-remote
    archive:
      config: Release-remote
