name: Drop
options:
  bundleIdPrefix: com.intellieffect.drop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# 접속 대상(localdev / remote)은 빌드 구성으로 가른다.
# 개발 중에도 리모트를 봐야 할 때가 있어 Debug를 둘로 나눴다.
configs:
  Debug-localdev: debug
  Debug-remote: debug
  Release-remote: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: J2Y925QHNV
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  DropCore:
    path: Packages/DropCore
  DropUI:
    path: Packages/DropUI
  # 로그인 창을 띄우는 SDK라 화면에 붙어 있다 — DropCore가 아니라 앱 타겟이 쓴다.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0

targets:
  Drop:
    type: application
    platform: iOS
    sources:
      - path: Drop
    configFiles:
      Debug-localdev: Config/Config-localdev.xcconfig
      Debug-remote: Config/Config-remote.xcconfig
      Release-remote: Config/Config-remote.xcconfig
    dependencies:
      - package: DropCore
        product: DropCore
      - package: DropUI
        product: DropUI
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        # 병렬 운영 기간 동안 Flutter 앱(com.intellieffect.drop.mobile)과 다른 번들 ID를 쓴다.
        # 같은 ID를 쓰면 한 기기에 두 앱을 동시에 설치할 수 없고 TestFlight 레코드가 겹친다.
        # BRU-22(Flutter 제거) 시점에 com.intellieffect.drop.mobile 로 교체한다.
        PRODUCT_BUNDLE_IDENTIFIER: com.intellieffect.drop.mobile.next
        INFOPLIST_FILE: Drop/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Drop-localdev:
    build:
      targets:
        Drop: all
    run:
      config: Debug-localdev
    test:
      config: Debug-localdev
    archive:
      config: Release-remote

  Drop-remote:
    build:
      targets:
        Drop: all
    run:
      config: Debug-remote
    test:
      config: Debug-remote
    archive:
      config: Release-remote
