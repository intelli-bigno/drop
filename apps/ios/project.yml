name: Drop
options:
  bundleIdPrefix: com.intellieffect.drop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# 접속 대상(localdev / remote)은 빌드 구성으로 가른다.
# 개발 중에도 리모트를 봐야 할 때가 있어 Debug를 둘로 나눴다.
configs:
  Debug-localdev: debug
  Debug-remote: debug
  Release-remote: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: J2Y925QHNV
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  DropCore:
    path: Packages/DropCore
  DropUI:
    path: Packages/DropUI
  # 로그인 창을 띄우는 SDK라 화면에 붙어 있다 — DropCore가 아니라 앱 타겟이 쓴다.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0

targets:
  Drop:
    type: application
    platform: iOS
    sources:
      - path: Drop
    configFiles:
      Debug-localdev: Config/Config-localdev.xcconfig
      Debug-remote: Config/Config-remote.xcconfig
      Release-remote: Config/Config-remote.xcconfig
    dependencies:
      - package: DropCore
        product: DropCore
      - package: DropUI
        product: DropUI
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: DropShare
        embed: true
      - target: DropWidget
        embed: true
    settings:
      base:
        # 과거 Flutter 앱이 쓰던 번들 ID를 이어받았다. 이미 App Group과 App Store Connect
        # 레코드가 붙어 있어 별도 등록이 필요 없다 — App Group 연결은 공개 API로는
        # 불가능해서, 새 ID를 쓰면 포털 수작업이 반드시 끼어든다.
        # (Flutter 앱과 공존하지 못한다는 제약이 있었으나, BRU-22에서 제거되어 무의미해졌다.)
        PRODUCT_BUNDLE_IDENTIFIER: com.intellieffect.drop.mobile
        INFOPLIST_FILE: Drop/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Drop/Drop.entitlements

  DropShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DropShare
    configFiles:
      Debug-localdev: Config/Config-localdev.xcconfig
      Debug-remote: Config/Config-remote.xcconfig
      Release-remote: Config/Config-remote.xcconfig
    dependencies:
      - package: DropCore
        product: DropCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intellieffect.drop.mobile.share
        INFOPLIST_FILE: DropShare/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: DropShare/DropShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"

  # 홈 화면 위젯. 이 타깃이 없어서 위젯이 갤러리에서 사라졌다 (BRU-35).
  # Supabase에 접속하지 않으므로 Config-*.xcconfig를 붙이지 않는다 —
  # 앱이 App Group에 적어 둔 요약(WidgetSnapshot)만 읽는다.
  DropWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DropWidget
    dependencies:
      - package: DropCore
        product: DropCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intellieffect.drop.mobile.widget
        INFOPLIST_FILE: DropWidget/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: DropWidget/DropWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"

  # 화면을 실제로 조작해 보는 검증 (BRU-78). 도메인 로직은 DropCore 테스트가
  # 시뮬레이터 없이 덮는다 — 여기서는 "스와이프가 뜨는지 / 시트가 열리는지"만 본다.
  #
  # 앱을 -dropPreview로 띄우므로 자격증명이 필요 없다. 느리므로 `make ios-test`와
  # 섞지 않는다: 빠른 피드백(0.03초)이 이 레포 TDD 사이클의 전제다.
  DropUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DropUITests
    dependencies:
      - target: Drop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intellieffect.drop.mobile.uitests
        TEST_TARGET_NAME: Drop
        TARGETED_DEVICE_FAMILY: "1"
        # 앱·확장은 Info.plist를 손으로 들고 있지만 테스트 번들은 내용이 없다.
        # 파일을 만들어 두는 대신 빌드가 생성하게 한다 — 없으면 코드 서명에서 막힌다.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Drop-localdev:
    build:
      targets:
        Drop: all
        DropUITests: [test]
    run:
      config: Debug-localdev
    test:
      config: Debug-localdev
      targets:
        - DropUITests
    archive:
      config: Release-remote

  Drop-remote:
    build:
      targets:
        Drop: all
    run:
      config: Debug-remote
    test:
      config: Debug-remote
    archive:
      config: Release-remote
