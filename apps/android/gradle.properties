kotlin.code.style=official

# Supabase 구성값의 기본치. 실제 값은 커밋하지 않는다 —
# `make android-config`가 .env.local/환경변수를 읽어 local.properties에 써 넣고,
# app 모듈이 그것을 BuildConfig로 굽는다. (자세한 경로는 apps/android/README.md)
SUPABASE_URL=
SUPABASE_ANON_KEY=
