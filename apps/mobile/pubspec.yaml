name: mobile
description: >-
  DROP 모바일 (Flutter). 현재 iOS 네이티브 구현 상태를 스펙으로 재구축한다 —
  경위는 Linear 프로젝트 「DROP Flutter 재구축」(BRU-152).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  drop_core:
    path: packages/drop_core
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2
  # 컴포저의 사진·영상 첨부 (BRU-158). iOS PhotosPicker 대응.
  image_picker: ^1.1.2
  # drop_core의 SupabaseRestClient에 넘길 http.Client — drop_core와 같은 제약.
  http: ^1.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
